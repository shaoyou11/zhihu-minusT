name: minusT iOS 自动编译发布
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
    inputs:
      force_build:
        description: 即使源码未变化也重新编译发布
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
concurrency:
  group: minust-ios
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.probe.outputs.needed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: 检查上游更新与缺失构建
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_MINUST_BUILD: ${{ inputs.force_build }}
        run: python3 scripts/minust-probe.py
  quality:
    needs: probe
    if: needs.probe.outputs.needed == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      build: ${{ steps.source.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 同步正式版并保留定制
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-minust.py
      - name: 验证自动合并与定制保护
        run: python3 -m unittest discover -s scripts/tests -p '*_test.py'
      - run: npm ci
      - name: 规范三方合并后的应用配置格式
        run: npx --no-install biome format --write app.json
      - run: npm run check
      - name: 保存已验证源码并判断是否需要编译
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_MINUST_BUILD: ${{ inputs.force_build }}
        run: |
          git add app.json
          if ! git diff --cached --quiet; then
            git commit -m "修复：规范同步上游后的应用配置格式"
          fi
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$FORCE_MINUST_BUILD" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "手动强制重新编译发布"
          else
            python3 scripts/minust-build-needed.py
          fi
      - name: 保存同步失败线索
        if: failure()
        run: |
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/minust-sync-conflicts.txt"
          echo "同步或质量检查未通过，保留现有正式安装包；定时维护将检查并尝试修复。" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: minust-sync-diagnostics
          path: ${{ runner.temp }}/minust-sync-conflicts.txt
          if-no-files-found: ignore
  ios:
    needs: quality
    if: needs.quality.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      SENTRY_NO_UPLOAD: "1"
      EXPO_PUBLIC_FIREBASE_ANALYTICS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.quality.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 设置独立构建号
        run: |
          node -e "const fs=require('fs');const p=require('./app.json');p.expo.ios.buildNumber=String(100+Number(process.env.GITHUB_RUN_NUMBER));fs.writeFileSync('app.json',JSON.stringify(p,null,2)+'\n')"
      - name: 生成 iOS 工程
        run: |
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: 编译 iPhone Release
        run: |
          set -euo pipefail
          xcodebuild -version
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/minust-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            COMPILER_INDEX_STORE_ENABLE=NO build > "$RUNNER_TEMP/minust-xcode.log" 2>&1
      - name: 校验并打包
        run: python3 scripts/package-minust.py "$RUNNER_TEMP/minust-build/Build/Products/Release-iphoneos" dist
      - uses: actions/upload-artifact@v4
        with:
          name: Zhihu-minusT-unsigned
          path: |
            dist/*.ipa
            dist/*.json
            dist/*.txt
          if-no-files-found: error
      - name: 发布正式安装包
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/minust-publish.py
      - name: 保存编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: minust-build-log
          path: ${{ runner.temp }}/minust-xcode.log
